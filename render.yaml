# Render service definition for the hosted prototype.
#
# Deploy with Render's Blueprints ("New + → Blueprint"), pointed at this
# repository. Everything the service needs is here except the signing key,
# which Render generates on first deploy and then keeps.
services:
  - type: web
    name: cocm-registry-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      # SECRET_KEY signs provider JWTs. app/core/config.py's literal default
      # is a dev-only placeholder that must never reach a deployment, so this
      # is generated by Render rather than written down anywhere.
      - key: SECRET_KEY
        generateValue: true

      # SQLite on the container's own disk. The "demo" in the filename is
      # load-bearing: scripts/seed_demo.py refuses to run against a database
      # whose URL doesn't contain it.
      - key: DATABASE_URL
        value: sqlite:////data/cocm_demo.db

      # Re-anchor the demo dates to today when someone loads the app and the
      # data was seeded on an earlier day. Set to 0 to freeze the data at
      # whatever the last boot seeded.
      - key: DEMO_REANCHOR_ON_LOAD
        value: "1"

      - key: ENVIRONMENT
        value: demo
